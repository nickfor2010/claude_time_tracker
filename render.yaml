# Render Blueprint for Parsley Time — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: parsley-time
    runtime: node
    region: singapore        # closest Render region to Taiwan
    plan: starter            # needed for the persistent disk (free plan loses data)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: APP_TIMEZONE
        value: Asia/Taipei
      - key: ADMIN_PASSWORD
        sync: false          # Render asks you to type it during setup
    disk:
      name: parsley-data
      mountPath: /var/data
      sizeGB: 1
