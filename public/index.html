<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parsley Time</title>
  <meta name="description" content="Clock in and out at Parsley.">
  <meta name="theme-color" content="#6e1e2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Parsley Time">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="app" id="app">
    <header class="app-top">
      <a class="brand" href="/" aria-label="Parsley 帕斯里 time clock">
        <img class="mark" src="/icons/icon-192.png" alt=""><span><span class="brand-name">Parsley</span><span class="brand-sub">帕斯里 · Time clock</span></span>
      </a>
      <div id="top-right"></div>
    </header>

    <!-- 1. Choose your name -->
    <section id="view-team" class="hidden">
      <div class="hero-clock"><div class="time tnum" data-clock></div><div class="date" data-date></div></div>
      <h1 class="login-title">Who's clocking in?</h1>
      <p class="muted" style="margin:0">Tap your name, then enter your PIN.</p>
      <div class="team-grid" id="team-grid"></div>
      <div class="card install-hint hidden" id="install-hint">
        <img src="/icons/icon-192.png" alt="">
        <div><b>Add to Home Screen</b><br><span class="muted" id="install-text">Install Parsley Time for one-tap punching.</span></div>
        <button class="btn btn-primary btn-sm hidden" id="install-btn" style="margin-left:auto">Install</button>
      </div>
    </section>

    <!-- 2. PIN -->
    <section id="view-pin" class="pin-wrap hidden">
      <button class="btn btn-ghost btn-sm" id="pin-back" style="align-self:flex-start"></button>
      <div class="pin-who" id="pin-who"></div>
      <div class="muted">Enter your PIN</div>
      <div class="pin-dots" id="pin-dots" aria-live="polite"></div>
      <div class="pinpad" id="pinpad"></div>
    </section>

    <!-- 3. Punch -->
    <section id="view-punch" class="hidden">
      <div class="hero-clock"><div class="time tnum" data-clock></div><div class="date" data-date></div></div>
      <div class="status-line" id="status"></div>
      <div class="punch-zone">
        <button class="punch" id="punch" aria-live="polite">
          <svg class="ring" viewBox="0 0 236 236" aria-hidden="true">
            <circle class="ring-bg" cx="118" cy="118" r="110" fill="none" stroke-width="8"/>
            <circle class="ring-fg" id="ring" cx="118" cy="118" r="110" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="691.15" stroke-dashoffset="691.15"/>
          </svg>
          <span class="core" id="punch-core"></span>
        </button>
      </div>
      <div class="stats">
        <div class="card stat"><div class="k">Today</div><div class="v" id="st-today">–</div></div>
        <div class="card stat"><div class="k">This week</div><div class="v" id="st-week">–</div></div>
        <div class="card stat"><div class="k">This month</div><div class="v" id="st-month">–</div></div>
      </div>
      <div class="section-title">This week</div>
      <div class="card week"><div class="week-bars" id="week"></div></div>
      <div class="section-title">Today</div>
      <div class="card timeline" id="today"></div>
      <div class="section-title">Recent shifts</div>
      <div class="card timeline" id="recent"></div>
    </section>

    <footer class="foot">Parsley 帕斯里 · Italian passion · <a href="/admin">Manager</a></footer>
  </main>
  <script type="module" src="/js/employee.js"></script>
</body>
</html>
