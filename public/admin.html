<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parsley Dashboard</title>
  <meta name="theme-color" content="#6e1e2e">
  <link rel="manifest" href="/admin.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Parsley 管理">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!-- Login -->
  <div class="login-screen hidden" id="login">
    <form class="card login-card" id="login-form">
      <span class="lang-slot"></span>
      <div class="brand"><img class="mark" src="/icons/icon-192.png" alt=""><span><span class="brand-name">Parsley</span><span class="brand-sub">帕斯里 · <span data-i18n>Manager dashboard</span></span></span></div>
      <h1 data-i18n>Welcome back</h1>
      <div class="field"><label for="pw" data-i18n>Admin password</label><input class="input" id="pw" type="password" autocomplete="current-password" required autofocus></div>
      <div class="err" id="login-err"></div>
      <button class="btn btn-primary" type="submit" data-i18n>Sign in</button>
      <a href="/" class="muted" style="font-size:13px;text-align:center" data-i18n>← Back to the time clock</a>
    </form>
  </div>

  <!-- App -->
  <div class="admin hidden" id="admin">
    <aside class="side">
      <a class="brand" href="/admin"><img class="mark" src="/icons/icon-192.png" alt=""><span><span class="brand-name">Parsley</span><span class="brand-sub">帕斯里 · <span data-i18n>Team time</span></span></span></a>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <span class="lang-slot"></span>
        <div class="side-card" id="side-live"></div>
        <a class="btn" href="/" target="_blank" rel="noopener" data-icon="clock"><span data-i18n>Open time clock</span></a>
        <button class="btn" id="logout" data-icon="logout"><span data-i18n>Sign out</span></button>
      </div>
    </aside>
    <main class="main">
      <div class="mobile-top">
        <a class="brand" href="/admin"><img class="mark" src="/icons/icon-192.png" alt=""><span><span class="brand-name">Parsley</span><span class="brand-sub">帕斯里 · <span data-i18n>Team time</span></span></span></a>
        <div class="top-actions"><span class="lang-slot"></span><button class="btn btn-ghost btn-icon" id="logout-m" data-i18n-aria-label="Sign out" aria-label="Sign out"></button></div>
      </div>
      <div id="banner"></div>
      <div id="page"></div>
    </main>
    <nav class="mobile-nav" id="mnav"></nav>
  </div>

  <!-- Shift dialog -->
  <dialog id="dlg-shift">
    <form method="dialog" id="form-shift">
      <h3 id="shift-title">Add shift</h3>
      <p class="muted" id="sh-hint" style="margin:-6px 0 0;font-size:13.5px"></p>
      <div class="field"><label for="sh-emp" data-i18n>Employee</label><select class="input" id="sh-emp" required></select></div>
      <div class="field"><label for="sh-date" data-i18n>Date</label><input class="input" type="date" id="sh-date" required></div>
      <div class="row-3">
        <div class="field"><label for="sh-in" data-i18n>Clock in</label><input class="input" type="time" id="sh-in" required></div>
        <div class="field"><label for="sh-out" data-i18n>Clock out</label><input class="input" type="time" id="sh-out"></div>
        <div class="field"><label for="sh-break" data-i18n>Break (min)</label><input class="input" type="number" min="0" step="5" id="sh-break" value="0"></div>
      </div>
      <div class="field"><label for="sh-note" data-i18n>Note</label><input class="input" id="sh-note" placeholder="e.g. forgot to clock out" data-i18n-placeholder="e.g. forgot to clock out"></div>
      <div class="err" id="sh-err"></div>
      <div class="dlg-actions">
        <button class="btn btn-danger hidden" type="button" id="sh-del" data-i18n>Delete</button>
        <span class="spacer"></span>
        <button class="btn btn-ghost" value="cancel" formnovalidate data-i18n>Cancel</button>
        <button class="btn btn-primary" id="sh-save" value="save" data-i18n>Save</button>
      </div>
    </form>
  </dialog>

  <!-- Employee dialog -->
  <dialog id="dlg-emp">
    <form method="dialog" id="form-emp">
      <h3 id="emp-title">Add team member</h3>
      <div class="field"><label for="em-name" data-i18n>Name</label><input class="input" id="em-name" required maxlength="40"></div>
      <div class="field"><label for="em-role" data-i18n>Role</label><input class="input" id="em-role" placeholder="Pastry chef" data-i18n-placeholder="Pastry chef" maxlength="40"></div>
      <div class="field"><label data-i18n>Pay type</label><div class="seg" id="em-paytype" role="radiogroup"></div></div>
      <div class="row-2">
        <div class="field pay-hourly"><label for="em-rate" data-i18n>Hourly rate (NT$)</label><input class="input" type="number" min="0" step="1" id="em-rate" value="196"></div>
        <div class="field pay-monthly"><label for="em-salary" data-i18n>Monthly salary (NT$)</label><input class="input" type="number" min="0" step="100" id="em-salary" value="0"></div>
        <div class="field"><label for="em-daily" data-i18n>Hours per work day</label><input class="input" type="number" min="1" max="24" step="0.5" id="em-daily" value="8"></div>
      </div>
      <div class="field"><label data-i18n>Work days</label><div class="days" id="em-days"></div></div>
      <div class="row-2">
        <div class="field pay-hourly"><label for="em-leave" data-i18n>Paid hours per leave day</label><input class="input" type="number" min="0" max="24" step="0.5" id="em-leave" value="8"></div>
        <div class="field"><label for="em-ins" data-i18n>Insurance deduction / month (NT$)</label><input class="input" type="number" min="0" step="1" id="em-ins" value="0"></div>
      </div>
      <div class="field"><label for="em-pin" id="em-pin-label">PIN (4–6 digits)</label><input class="input" id="em-pin" inputmode="numeric" pattern="\d{4,6}" maxlength="6" autocomplete="off"></div>
      <label class="check hidden" id="em-active-wrap"><input type="checkbox" id="em-active"> <span data-i18n>Active (can clock in)</span></label>
      <div class="err" id="em-err"></div>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button class="btn btn-ghost" value="cancel" formnovalidate data-i18n>Cancel</button>
        <button class="btn btn-primary" value="save" data-i18n>Save</button>
      </div>
    </form>
  </dialog>

  <!-- Payroll adjustment dialog -->
  <dialog id="dlg-pay">
    <form method="dialog" id="form-pay">
      <h3 id="pay-title"></h3>
      <p class="muted" id="pay-hint" style="margin:-6px 0 0;font-size:13.5px"></p>
      <div class="row-2">
        <div class="field"><label for="pa-bonus" data-i18n>Bonus (NT$)</label><input class="input" type="number" min="0" step="1" id="pa-bonus"></div>
        <div class="field"><label for="pa-ins" data-i18n>Insurance (NT$)</label><input class="input" type="number" min="0" step="1" id="pa-ins"></div>
      </div>
      <div class="row-2">
        <div class="field"><label for="pa-ded" data-i18n>Other deduction (NT$)</label><input class="input" type="number" min="0" step="1" id="pa-ded"></div>
        <div class="field"><label for="pa-dednote" data-i18n>Deduction reason</label><input class="input" id="pa-dednote" maxlength="100"></div>
      </div>
      <div class="field"><label for="pa-note" data-i18n>Note on payslip</label><input class="input" id="pa-note" maxlength="300"></div>
      <div class="err" id="pa-err"></div>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button class="btn btn-ghost" value="cancel" formnovalidate data-i18n>Cancel</button>
        <button class="btn btn-primary" value="save" data-i18n>Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
