<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Staff agreement 員工守則 · Parsley</title>
  <meta name="theme-color" content="#6e1e2e">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { background: var(--surface-2); }
    .wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 40px; }
    .tools { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .paper { background: #fff; color: #2a1418; border-radius: 18px; box-shadow: var(--shadow); padding: 34px 38px; }
    .paper .doc, .paper .doc b { color: #2a1418; }
    .paper .doc h4 { color: #6e1e2e; }
    .head { display: flex; gap: 14px; align-items: center; border-bottom: 2px solid #6e1e2e; padding-bottom: 16px; margin-bottom: 18px; }
    .head img { width: 50px; height: 50px; border-radius: 14px; }
    .head h1 { font-family: var(--font-display); font-size: 22px; margin: 0; color: #6e1e2e; }
    .head span { color: #8c7a7d; font-size: 13.5px; }
    .lang-part + .lang-part { margin-top: 30px; padding-top: 24px; border-top: 1px dashed #d9cfc6; }
    .sig { margin-top: 30px; border: 1.5px solid #6e1e2e; border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 24px; font-size: 14px; }
    .sig small { display: block; color: #8c7a7d; font-size: 11.5px; font-weight: 600; }
    .sig .full { grid-column: 1 / -1; }
    .sig .name { font-family: var(--font-display); font-size: 22px; color: #6e1e2e; }
    .unsigned { color: #c0392b; font-weight: 700; }
    .sig .sec { font-size: 12px; letter-spacing: .08em; font-weight: 700; color: #6e1e2e; border-bottom: 1px solid #eae3dc; padding-bottom: 4px; }
    .sig .sec:not(:first-child) { margin-top: 8px; }
    .sig .line { display: block; border-bottom: 1px solid #2a1418; height: 24px; }
    .sig .stamp { display: block; width: 110px; height: 110px; border: 1px dashed #b8a9a2; border-radius: 10px; margin-top: 4px; }
    .sig .note { font-size: 12px; color: #8c7a7d; }
    .tagline { text-align: center; color: #6e1e2e; font-size: 13px; margin: 22px 0 0; line-height: 1.6; }
    @media (max-width: 600px) { .paper { padding: 22px 18px; } .sig { grid-template-columns: 1fr; } }
    @media print {
      body { background: #fff; }
      .tools { display: none; }
      .wrap { padding: 0; max-width: none; }
      .paper { box-shadow: none; border-radius: 0; padding: 0; }
      .lang-part + .lang-part { break-before: page; border-top: none; }
      .sig { break-inside: avoid; }
      @page { size: A4; margin: 16mm; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tools">
      <a class="btn btn-ghost btn-sm" id="back" href="/">←</a>
      <button class="btn btn-primary btn-sm" id="print">Print / PDF 列印</button>
    </div>
    <div id="paper"><div class="card empty">…</div></div>
  </div>
  <script type="module" src="/js/agreement.js"></script>
</body>
</html>
